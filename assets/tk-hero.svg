  <radialGradient id="halo"><stop stop-color="#f4d326" stop-opacity=".12"/><stop offset="1" stop-color="#161715" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="480" rx="20" fill="#161715"/>
<rect x="1" y="1" width="1198" height="478" rx="19" fill="url(#grid)" stroke="#373833"/>
