<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">TK — There is a bug in the code.</title><desc id="desc">A cockroach carries a code fragment, touches TK, gets shocked and dies. A replacement arrives while the body remains. Automatic loop; interactive version is a separate HTML file.</desc>
<style>.leg{transform-box:fill-box;transform-origin:center}.walking .leg.a{animation:legs .12s ease-in-out infinite alternate}.walking .leg.b{animation:legs .12s ease-in-out infinite alternate-reverse}.walking .antennae{animation:feelers .8s ease-in-out infinite alternate;transform-origin:80px 0px}.dead .leg{transform:rotate(30deg) scaleY(.5)}.dead .antennae{opacity:.6;transform:rotate(8deg)}.dead{opacity:.65}.shocked .roach{filter:drop-shadow(0 0 8px #f4d326)}.shocked .leg{animation-duration:.045s}.live{cursor:pointer;outline:none}.live:focus-visible .focus-ring{opacity:1}.focus-ring{opacity:0}.zap{opacity:0}.shocked .zap{opacity:1;animation:spark .15s infinite alternate}@keyframes legs{to{transform:rotate(12deg) translateY(3px)}}@keyframes feelers{to{transform:rotate(5deg)}}@keyframes spark{to{opacity:.25}}@media(prefers-reduced-motion:reduce){.walking .leg,.walking .antennae,.shocked .zap{animation:none}}</style><defs>
